<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>보리네</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-title" content="보리네">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 학생이 매일 여는 차분한 학습 수첩
   IDEA: 보리네 알림장 + 성적표를 한 손에
   PICTURE: 각 탭의 실제 카드·캘린더·그래프가 곧 화면
   COLOUR and TYPE: 흰 카드, 녹흑 잉크, 영어=보리 금색, 수학=청록 / Noto Sans KR
   LAYOUT: 한 열, 폰 우선, 하단 고정 탭바 5개 */
:root{color-scheme:light dark;
  --bg:light-dark(#f3f4f0,#101311);--card:light-dark(#fff,#1a1f1b);--ink:light-dark(#17221b,#eef1ec);
  --mute:light-dark(#5b6557,#a3ab9f);--line:light-dark(#e1e4dc,#2b322c);--bar:light-dark(#d7dcd2,#3a423b);
  --deep:light-dark(#5f635f,#a3a8a3);--onbtn:light-dark(#fff,#111);--priv:light-dark(#00462A,#7bc59a);--soft:light-dark(#f6f7f3,#222823);
  --en:light-dark(#f2c200,#f5cf3a);--ma:light-dark(#2f9e44,#69db7c);--bad:light-dark(#b3261e,#f2b8b5);--ok:light-dark(#2f6b2a,#9fd49a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{overflow-x:hidden;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;max-width:100vw;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(84px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
.demo{background:var(--deep);color:var(--onbtn);font-size:12px;text-align:center;padding:5px 12px}
.wrap{max-width:720px;margin:0 auto;padding:6px 14px 20px}
.head{padding:16px 2px 14px}.head h1{margin:0;font-size:24px;line-height:1.2;font-weight:900}.head .sub{font-size:14px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 small{font-size:13px;font-weight:500;color:var(--mute)}
.muted{color:var(--mute);font-size:14px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:none;font:inherit;font-size:15px;font-weight:700;color:var(--mute);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--deep);color:var(--onbtn)}
button{font:inherit}:focus-visible{outline:3px solid var(--en);outline-offset:2px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.tag.영어{background:color-mix(in srgb,var(--en) 28%,transparent);color:light-dark(#7a5c00,#f5cf3a)}
.tag.수학{background:color-mix(in srgb,var(--ma) 16%,transparent);color:light-dark(#237a34,#69db7c)}
.tag.type{background:var(--soft);color:var(--mute);font-weight:500}
.item{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px;display:grid;gap:4px}
.item .t{font-weight:700}.item .meta{font-size:13px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 10px}
.item .top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.st{margin-left:auto;font-size:13px;font-weight:700;white-space:nowrap}
.st.late{color:var(--bad)}.st.done{color:var(--ok)}.st.soon{color:light-dark(#8a5a00,#f0c46a)}
.next{display:flex;gap:14px;align-items:center}
.next .when{background:var(--deep);color:var(--onbtn);border-radius:14px;padding:10px 14px;text-align:center;min-width:86px}
.next .when b{display:block;font-size:24px;line-height:1.1}.next .when span{font-size:13px;opacity:.85}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{border:1px solid var(--line);border-radius:10px;padding:6px 2px;text-align:center;min-height:64px;background:var(--card);color:var(--ink);cursor:pointer;display:grid;align-content:start;gap:2px}
.day small{font-size:11px;color:var(--mute)}.day b{font-size:15px}
.day.today{border-color:var(--deep);border-width:2px}.day[aria-pressed=true]{background:var(--deep);color:var(--onbtn)}.day[aria-pressed=true] small{color:inherit;opacity:.8}
.day.out{opacity:.4}.day .dots{display:flex;gap:2px;justify-content:center;flex-wrap:wrap}
.dot{width:6px;height:6px;border-radius:50%}.dot.영어{background:var(--en)}.dot.수학{background:var(--ma)}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;font-size:12px;color:var(--mute);text-align:center;margin-bottom:4px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.nav b{font-size:16px}.nav button{width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer;font-size:18px}
.slot{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.slot:last-child{border:0}
.slot .d{width:62px;font-weight:700;font-size:14px}.slot.now .d{color:var(--deep)}
.fb{border-left:3px solid var(--line);padding:4px 0 4px 12px;margin-top:12px}
.fb p{margin:4px 0 0;font-size:15px}.fb .k{font-size:12px;font-weight:700;color:var(--mute);margin-right:6px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--soft);border-radius:12px;padding:12px}.stat b{display:block;font-size:clamp(20px,5.4vw,26px);line-height:1.2}.stat span{font-size:12px;color:var(--mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{min-height:36px;padding:0 14px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--ink);cursor:pointer;font-size:14px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cmp{display:grid;grid-template-columns:44px 1fr 44px;gap:6px 8px;align-items:center;font-size:13px;margin-top:6px}
.cmp .b{height:12px;border-radius:6px;background:var(--bar)}.cmp .b.me{background:var(--deep)}.cmp .v{text-align:right;font-weight:700}
.weak{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.weak:last-child{border:0}
.weak .n{margin-left:auto;font-size:13px;font-weight:700;color:var(--bad);white-space:nowrap}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 4px;border-bottom:1px solid var(--line);font-size:14px}
th{font-size:12px;color:var(--mute);font-weight:500}.num{text-align:right;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mute);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.check{justify-self:start;margin-top:6px;min-height:40px;padding:0 16px;border:0;border-radius:10px;background:var(--deep);color:var(--onbtn);font-weight:700;cursor:pointer}
.doneat{margin-top:4px;font-size:13px;font-weight:700;color:var(--ok);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.undo{border:0;background:none;color:var(--mute);text-decoration:underline;font-size:13px;cursor:pointer;min-height:32px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:18px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;width:max-content;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.name{min-height:64px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);cursor:pointer;display:grid;place-content:center;gap:2px}
.name b{font-size:18px}.name span{font-size:13px;color:var(--mute)}
.pinbox{max-width:360px;margin:0 auto 12px}
.pins{display:flex;justify-content:center;gap:16px;margin-top:6px}.pins i{width:16px;height:16px;border-radius:50%;border:2px solid var(--mute)}
.pins i.on{background:var(--deep);border-color:var(--deep)}
.pins.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{min-height:60px;border:1px solid var(--line);border-radius:14px;background:var(--soft);color:var(--ink);font-size:24px;font-weight:700;cursor:pointer}
.pad button:disabled{opacity:.4;cursor:default}
.keep{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--mute);text-align:center}.keep input{width:18px;height:18px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;align-items:end}
.form label,.fl{display:grid;gap:4px;font-size:13px;color:var(--mute)}.form .full{grid-column:1/-1}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:8px 12px;width:100%}
textarea{min-height:64px;resize:vertical}input[type=checkbox]{width:20px;height:20px;min-height:0;padding:0;accent-color:var(--deep)}
input.gin{width:72px;text-align:right;padding:6px 8px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:0;font-weight:700;background:var(--deep);color:var(--onbtn);cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.danger{background:none;border:1px solid var(--line);color:var(--bad)}
.checks{display:flex;flex-wrap:wrap;gap:8px}.checks label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:14px;color:var(--ink);background:var(--card)}
.pv{position:sticky;top:0;z-index:5;background:var(--soft);border:1px solid var(--line);color:var(--ink);font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;margin-top:8px}
.pv button{background:var(--deep);color:var(--onbtn);border:0;border-radius:8px;min-height:36px;padding:0 10px;font-weight:700;cursor:pointer}
.srow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.srow:last-child{border:0}
.acts{display:flex;gap:6px;flex-wrap:wrap}.scroll{overflow-x:auto}
.lrow{display:flex;align-items:center;gap:10px;width:100%;padding:11px 4px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);cursor:pointer;font-size:15px}
.lrow:last-child{border-bottom:0}.lrow .d{display:grid;min-width:62px;font-weight:700;font-size:14px;text-align:left}.lrow .d small{font-weight:400;color:var(--mute);font-size:12px}
.badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.b{font-style:normal;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;white-space:nowrap}
.b.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}.b.no{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.b.todo{background:color-mix(in srgb,var(--priv) 14%,transparent);color:var(--priv)}
.card.private{border-style:dashed;border-color:color-mix(in srgb,var(--priv) 40%,var(--line));background:color-mix(in srgb,var(--priv) 7%,var(--card))}
.todo{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.todo:last-of-type{border-bottom:0}
.todo.done .tt{text-decoration:line-through;color:var(--mute)}
.tick{width:28px;height:28px;flex:none;border-radius:8px;border:2px solid var(--mute);background:var(--card);color:var(--onbtn);font-weight:900;cursor:pointer;display:grid;place-items:center}
.tick[aria-pressed=true]{background:var(--deep);border-color:var(--deep)}
a.lk{color:inherit;text-decoration:underline;cursor:pointer}
details.card summary{cursor:pointer;min-height:28px;list-style-position:inside}
.glink{border:0;background:none;color:var(--ink);cursor:pointer;min-height:40px;font-size:14px;white-space:nowrap;padding:0 2px}
tr.hl td{background:color-mix(in srgb,var(--en) 18%,transparent)}
.lv{font-size:20px;font-weight:900;padding:2px 12px;border-radius:10px;background:var(--soft);border:1px solid var(--line)}.lv.none{font-size:13px;font-weight:500;color:var(--mute)}
.lk2{border:0;background:none;padding:0;color:inherit;font:inherit;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.lk2.chipl{text-decoration:none;min-height:36px}
.lbtn{width:100%;border:0;background:none;color:var(--ink);cursor:pointer;padding:0;font:inherit}
.bigrate{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.bigrate b{font-size:clamp(44px,13vw,60px);font-weight:900;line-height:1}.bigrate span{color:var(--mute);font-size:14px}
.dl{font-size:13px;font-weight:700;margin-left:4px;white-space:nowrap}.dl.up{color:var(--ok)}.dl.down{color:var(--bad)}
.note{margin-top:12px;background:var(--soft);border-radius:12px;padding:12px}.note p{margin:4px 0 0;font-size:15px}
.sbar{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:7px 0}
.track{height:12px;border-radius:6px;background:var(--bar);overflow:hidden}.track i{display:block;height:100%;background:var(--deep);border-radius:6px}
.chip.sub[aria-pressed=false]{opacity:.5}.chip.sub.영어[aria-pressed=true]{background:var(--en);border-color:var(--en);color:#3a2c00}.chip.sub.수학[aria-pressed=true]{background:var(--ma);border-color:var(--ma);color:#fff}
.linkbox{font-size:13px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px;word-break:break-all;user-select:all}
.card.install{border-color:color-mix(in srgb,var(--en) 55%,var(--line))}
.rchips{display:grid;grid-template-columns:repeat(6,minmax(46px,1fr));gap:6px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:2px;-webkit-overflow-scrolling:touch}.rchips label{display:block;cursor:pointer;scroll-snap-align:start}
.rchips input{position:absolute;opacity:0;pointer-events:none}
.rchips span{display:flex;align-items:center;justify-content:center;min-height:42px;padding:0 4px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--ink);font-size:15px;font-weight:700}
.rchips input:checked+span{background:var(--deep);border-color:var(--deep);color:var(--onbtn)}
.rchips input:focus-visible+span{outline:3px solid var(--en);outline-offset:2px}
.slots{border-collapse:separate;border-spacing:2px;width:100%;min-width:290px;table-layout:fixed}
.slots th{font-size:11px;color:var(--mute);font-weight:700;padding:2px;text-align:center;border:0;white-space:nowrap}
.slots th:first-child{width:32px}.slots th.sat{width:34px;border-left:2px solid var(--line)}
.slots td{padding:0;border:0;height:40px}
.sc{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--soft);color:var(--ink);cursor:pointer;padding:1px;display:grid;place-content:center;line-height:1.1;overflow:hidden}
.sc b{font-size:12px}.sc small{font-size:9px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sc.영어{background:color-mix(in srgb,var(--en) 45%,var(--card));border-color:var(--en)}
.sc.수학{background:color-mix(in srgb,var(--ma) 35%,var(--card));border-color:var(--ma)}
.sc .nm{display:block;font-size:10px;border-radius:4px;margin:1px 0;padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;max-width:100%}
.sc.taken{cursor:not-allowed;background:var(--card);border-style:dashed}
.sc.all{height:auto;min-height:44px;align-content:center}.sc.sel{outline:3px solid var(--ink);outline-offset:-1px}
.slotpanel{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.nm.영어{background:color-mix(in srgb,var(--en) 45%,var(--card))}.nm.수학{background:color-mix(in srgb,var(--ma) 35%,var(--card))}
.b.ex{background:color-mix(in srgb,var(--en) 30%,transparent);color:light-dark(#7a5c00,#f5cf3a)}
.empty{padding:20px 0;text-align:center;color:var(--mute);font-size:14px}
.more{display:block;width:100%;margin-top:10px;min-height:44px;border:1px solid var(--line);border-radius:12px;background:none;color:var(--ink);font-weight:700;cursor:pointer}
.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row span{color:var(--mute)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(var(--n,5),1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{border:0;background:none;color:var(--mute);display:grid;justify-items:center;gap:2px;font-size:12px;min-height:52px;cursor:pointer;padding:4px 0}
.tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current=page]{color:var(--ink);font-weight:700}
.tabbar button[aria-current=page] svg{stroke-width:2.3}
@media(prefers-reduced-motion:no-preference){.view{animation:fade .18s ease-out}@keyframes fade{from{opacity:0;transform:translateY(4px)}}}
</style>

<body>
<main class="wrap"><div class="view" id="view"></div></main>
<div class="toast" id="toast" role="status"></div>
<nav class="tabbar" id="tabbar" aria-label="메뉴"></nav>
<script>
{
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TODAY=(d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`)(new Date()), NOW_TIME='00:00'; const DOW=['일','월','화','수','목','금','토'];
const D=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const S=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const add=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return S(d)};
const md=s=>{const d=D(s);return `${d.getMonth()+1}/${d.getDate()}`};
const mdw=s=>{const d=D(s);return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`};
const diff=(a,b)=>Math.round((D(a)-D(b))/864e5);
const monday=s=>{const d=D(s);return add(s,-((d.getDay()+6)%7))};

let nid=0;
// 실제 데이터는 로그인 후 데이터베이스에서 불러와요 (loadAll)
const STUDENTS=[];
const TEACHER={name:'선생님'};
const stu=id=>STUDENTS.find(s=>s.id===id);
const ALL_SCHEDULE=[], ALL_LESSONS=[], ASSIGN=[], RESULTS={}, ALL_SCHOOL=[];
const TYPES=['개념평가','맞춤평가','숙제평가','단원평가','내신모고','기출평가'];
const GRADES=['중1','중2','중3','고1','고2','고3'];
const gradeChips=(name,cur,req)=>`<div class="rchips" role="radiogroup">${GRADES.map(g=>`<label><input type="radio" name="${name}" value="${g}"${g===cur?' checked':''}${req?' required':''}><span>${g}</span></label>`).join('')}</div>`;

  else if(a.status==='graded'&&a.doneAt) act=`<div class="doneat">✓ ${fmtAt(a.doneAt)} 완료${lateMark(a)}</div>`;
  return `<div class="item"><div class="top"><span class="tag ${a.subj}">${a.subj}</span><span class="tag type">${a.type}</span>${stat(a)}</div>

function lineChart(series,labels,{min=0,max=100,unit='%'}={}){
  const W=600,H=230,L=40,R=14,T=20,B=30,n=labels.length;
  const x=i=>L+(n<2?(W-L-R)/2:i/(n-1)*(W-L-R)), y=v=>T+(1-(v-min)/(max-min))*(H-T-B);
  let g='';
  for(let v=min;v<=max;v+=(max-min)/4) g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="var(--mute)">${v}${unit}</text>`;
  labels.forEach((l,i)=>{if(n<=8||i%Math.ceil(n/8)===0)g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--mute)">${esc(l)}</text>`});
  series.forEach(s=>{const pts=s.values.map((v,i)=>v==null?null:[x(i),y(v),v]).filter(Boolean);
    g+=`<polyline points="${pts.map(p=>p[0]+','+p[1]).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round"${s.dash?' stroke-dasharray="5 5"':''}/>`;
    pts.forEach(p=>{g+=`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--card)" stroke="${s.color}" stroke-width="2"/>`;if(s.labels)g+=`<text x="${p[0]}" y="${p[1]-9}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${p[2]}</text>`});});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="추이 그래프">${g}</svg>`;
}

  if(gPer==='월간'){const d=D(rDate);start=S(new Date(d.getFullYear(),d.getMonth(),1));end=S(new Date(d.getFullYear(),d.getMonth()+1,0));

  if(bySubj.length===2&&bySubj.every(x=>x.v!=null)){const[h,l]=[...bySubj].sort((a,b)=>b.v-a.v);if(h.v-l.v>=5)notes.push(`${h.s}(${h.v}%)가 ${l.s}(${l.v}%)보다 강해요.`)}

  <section class="card"><h2>성취도 분석 리포트 <small>${label}</small></h2>

  ${g.length>1?`<section class="card"><h2>정답률 추이 <small>마감일 순</small></h2>${lineChart(subs.map(s=>({color:col(s),labels:true,values:g.map(a=>a.subj===s?rate(a):null)})),g.map(a=>md(a.due)))}
    <div class="legend">${subs.map(s=>`<span><i style="background:${col(s)}"></i>${s}</span>`).join('')}</div></section>`:''}

function school(){
  if(!TERMS.length) return '<section class="card"><div class="empty">아직 학교 성적이 없어요. 선생님이 입력하면 여기에 보여요.</div></section>';
  const avgOf=r=>{const v=[r.mid,r.fin].filter(x=>x!=null);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10:null};
  const pctOf=r=>r.rank&&r.n?Math.round(r.rank/r.n*1000)/10:null;
  const rows=SCHOOL.filter(r=>r.term===term), subs=['영어','수학'].filter(s=>SCHOOL.some(r=>r.subj===s));
  const col=s=>`var(--${s==='영어'?'en':'ma'})`;
  const series=subs.flatMap(s=>[
    {subj:s,color:col(s),labels:true,values:TERMS.map(t=>avgOf(SCHOOL.find(x=>x.term===t&&x.subj===s)||{}))},
    {subj:s,color:col(s),dash:true,values:TERMS.map(t=>SCHOOL.find(x=>x.term===t&&x.subj===s)?.avg??null)}]);
  const card=r=>{const me=avgOf(r), d=me!=null&&r.avg!=null?me-r.avg:null, p=pctOf(r);
    return `<section class="card"><div class="rowtop"><h2 style="margin:0">${sTag(r.subj)} ${term}</h2>
      <span class="lv${r.lv?'':' none'}">${r.lv?esc(r.lv)+(/^\d$/.test(r.lv)?'등급':''):'등급 미정'}</span></div>
      <div class="stats" style="margin-top:12px"><div class="stat"><b>${r.mid??'–'}</b><span>중간고사</span></div><div class="stat"><b>${r.fin??'–'}</b><span>기말고사</span></div><div class="stat"><b>${me??'–'}</b><span>내 평균</span></div></div>
      ${r.avg!=null&&me!=null?`<div class="cmp" style="grid-template-columns:64px 1fr 48px;margin-top:12px"><span>내 평균</span><div class="b" style="width:${me}%;background:${col(r.subj)}"></div><span class="v">${me}</span>
        <span>학교 평균</span><div class="b" style="width:${r.avg}%"></div><span class="v">${r.avg}</span></div>
        <p class="muted" style="margin:6px 0 0">학교 평균보다 <b style="color:var(--ink)">${Math.abs(d).toFixed(1)}점 ${d>=0?'높아요':'낮아요'}</b></p>`:''}
      <div class="row" style="border:0;padding-bottom:0"><span>석차</span><b>${r.rank&&r.n?`${r.rank} / ${r.n}명 <span class="muted">(상위 ${p}%)</span>`:r.n?`– / ${r.n}명`:'–'}</b></div>
      ${r.mid==null||r.fin==null?'<p class="muted" style="margin:4px 0 0">아직 안 본 시험이 있어요. 평균은 입력된 시험만으로 계산했어요.</p>':''}</section>`};
  const analysis=subs.map(s=>{const rs=TERMS.map(t=>SCHOOL.find(x=>x.term===t&&x.subj===s)).filter(Boolean);
    if(rs.length<2)return `<li>${sTag(s)} 비교할 학기가 아직 하나뿐이에요.</li>`;
    const [a,b]=rs.slice(-2), ma=avgOf(a), mb=avgOf(b), out=[];
    if(ma!=null&&mb!=null)out.push(`평균 ${ma} → ${mb} (${mb-ma>=0?'+':''}${(mb-ma).toFixed(1)}점)`);
    if(ma!=null&&mb!=null&&a.avg!=null&&b.avg!=null){const ga=ma-a.avg,gb=mb-b.avg;out.push(`학교 평균과의 차이 ${ga>=0?'+':''}${ga.toFixed(1)} → ${gb>=0?'+':''}${gb.toFixed(1)}`)}
    if(a.lv&&b.lv)out.push(`등급 ${esc(a.lv)} → ${esc(b.lv)}`);
    if(pctOf(a)!=null&&pctOf(b)!=null)out.push(`석차 상위 ${pctOf(a)}% → ${pctOf(b)}%`);
    return `<li>${sTag(s)} <b>${a.term} → ${b.term}</b><div class="muted" style="margin-top:2px">${out.join(' · ')||'비교할 값이 없어요.'}</div></li>`}).join('');
  const vals=series.flatMap(x=>x.values).filter(v=>v!=null), lo=Math.max(0,Math.floor((Math.min(...vals)-5)/20)*20);
  return `<div class="chips">${TERMS.map(t=>`<button class="chip" data-term="${t}" aria-pressed="${term===t}">${t}</button>`).join('')}</div>
  ${rows.map(card).join('')}
  <section class="card"><h2>학기별 추이 <small>학기 평균</small></h2>${lineChart(series,TERMS,{min:lo,max:100,unit:''})}
    <div class="legend">${subs.map(s=>`<span><i style="background:${col(s)}"></i>${s}</span>`).join('')}<span>실선: 내 평균 · 점선: 학교 평균</span></div></section>
  <section class="card"><h2>변화 분석 <small>직전 학기 대비</small></h2><ul style="margin:0;padding-left:0;list-style:none;display:grid;gap:10px;font-size:15px">${analysis}</ul></section>`;
}

  const [P,SC,LE,AS,RE,SG,MK]=await Promise.all(['profiles','schedules','lessons','assignments','results','school_grades','makeup_lessons'].map(t=>DB.rows(t)));
  const TD=role==='teacher'?await DB.rows('teacher_todos'):[];
  LINKS={};if(role==='teacher')(await DB.rows('student_links')).forEach(r=>{LINKS[N(r.student_id)]=r.token});
  const studs=P.filter(p=>p.role==='student');
  [...studs].sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at))).forEach(p=>N(p.id));
  STUDENTS.length=0;studs.sort((a,b)=>a.name.localeCompare(b.name,'ko')).forEach(p=>STUDENTS.push({id:N(p.id),uid:p.id,name:p.name,school:p.school||'',grade:p.grade||'',subjects:p.subjects||[]}));
  const me=P.find(p=>p.id===MYUID);if(me&&role==='teacher')TEACHER.name=me.name;
  ALL_MAKEUPS=MK.map(r=>({id:r.id,sid:N(r.student_id),date:r.date,time:r.time,subj:r.subject}));
  ALL_SCHEDULE.length=0;SC.forEach(r=>ALL_SCHEDULE.push({id:r.id,sid:N(r.student_id),dow:r.dow,time:r.time,subj:r.subject}));
  ALL_LESSONS.length=0;LE.forEach(r=>ALL_LESSONS.push({sid:N(r.student_id),date:r.date,subj:r.subject,topic:r.topic||'',prep:r.prep||'',good:r.good||'',next:r.next||''}));
  ASSIGN.length=0;AS.forEach(r=>ASSIGN.push({id:r.id,subj:r.subject,type:r.type,title:r.title,unit:r.unit||'',given:r.given,due:r.due,total:r.total,max:nn(r.max),nat:nn(r.nat),gn:nn(r.gn)}));
  for(const k in RESULTS)delete RESULTS[k];ASSIGN.forEach(a=>RESULTS[a.id]={});
  RE.forEach(r=>{(RESULTS[r.assignment_id]??={})[N(r.student_id)]={status:r.status,doneAt:localAt(r.done_at),correct:r.correct,score:nn(r.score)}});
  ALL_SCHOOL.length=0;SG.forEach(r=>ALL_SCHOOL.push({sid:N(r.student_id),term:r.term,subj:r.subject,mid:nn(r.mid),fin:nn(r.fin),avg:nn(r.avg),lv:r.lv||'',rank:r.rank,n:r.n}));
  TODOS=TD.map(r=>({id:r.id,sid:N(r.student_id),date:r.lesson_date,subj:r.subject,text:r.text,due:r.due,done:r.done,doneAt:localAt(r.done_at)}));
  if(!stu(schoolSid))schoolSid=STUDENTS[0]?.id??null;
}
// 저장 → 다시 불러오기 → 화면 갱신. 실패하면 이유를 보여 줘요
async function save(fn,msg){
  try{const out=await fn();await loadAll();if(role==='student'||preview)load(curSid);const m=typeof msg==='function'?msg(out):msg;render();if(m)toast(m);return true}
  catch(e){console.error(e);toast('저장하지 못했어요: '+(e.message||e));try{await loadAll()}catch(_){}render();return false}
}

// ===================== 로그인 =====================
// 학생: 선생님이 준 전용 링크(#t=…)로 열고, 처음 한 번만 번호 네 자리
// 선생님: 주소 끝에 #teacher
let pwOpen=false, needsSetup=false, loginErr='', lockedUntil=0, busy=false, lockTimer=null, pinNotice=null;
let gate='none', linkToken=null, linkName='', linkBad='';
const LINK_KEY='borine-link';
function readRoute(){
  const h=location.hash||'';
  if(h.startsWith('#t=')){linkToken=h.slice(3).replace(/[^a-f0-9]/g,'');try{localStorage.setItem(LINK_KEY,linkToken)}catch(e){}gate='student'}
  else if(h==='#teacher'){gate='teacher'}
  else{try{linkToken=localStorage.getItem(LINK_KEY)}catch(e){}gate=linkToken?'student':'none'}
}
async function prepareGate(){
  loginErr='';linkBad='';
  if(gate==='teacher'){try{const r=await DB.api('status');needsSetup=!!r.needsSetup}catch(e){loginErr=e.message}}
  if(gate==='student'&&linkToken){try{const r=await DB.api('link?t='+encodeURIComponent(linkToken));linkName=r.name||''}catch(e){linkBad=e.message}}
}
function login(){
  if(gate==='teacher'&&needsSetup) return `<div class="head" style="padding-top:28px"><div class="sub">보리네 · 처음 설정</div><h1>선생님 계정 만들기</h1></div>
    <section class="card"><p class="muted" style="margin:0">처음 한 번만 하는 설정이에요. 여기서 만든 이메일과 비밀번호로 선생님 화면에 들어가요. 선생님 계정이 만들어지면 이 화면은 다시 나오지 않아요.</p></section>
    <form id="setupForm" class="card form" style="max-width:420px">
      <label class="full">이름 (학생에게 보여요)<input name="name" value="보리네 선생님" required></label>
      <label class="full">이메일<input name="email" type="email" autocomplete="username" required></label>
      <label class="full">비밀번호 (8자 이상)<input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
      <label class="full">비밀번호 확인<input name="password2" type="password" autocomplete="new-password" minlength="8" required></label>
      ${loginErr?`<p class="full" style="color:var(--bad);margin:0">${esc(loginErr)}</p>`:''}
      <button class="btn full"${busy?' disabled':''}>${busy?'만드는 중…':'선생님 계정 만들기'}</button></form>`;
  if(gate==='teacher') return `<div class="head" style="padding-top:28px"><div class="sub">보리네</div><h1>선생님 로그인</h1></div>
    <form id="teacherLogin" class="card form" style="max-width:420px">
      <label class="full">이메일<input name="email" type="email" autocomplete="username" required></label>
      <label class="full">비밀번호<input name="password" type="password" autocomplete="current-password" required></label>
      ${loginErr?`<p class="full" style="color:var(--bad);margin:0">${esc(loginErr)}</p>`:''}
      <button class="btn full"${busy?' disabled':''}>${busy?'확인 중…':'로그인'}</button></form>`;
  if(gate==='none'||linkBad) return `<div style="padding-top:22vh;text-align:center"><img src="./icon.svg" alt="" width="72" height="72" style="border-radius:18px">
    <h1 style="font-size:26px;margin:16px 0 6px">보리네</h1>
    <p class="muted" style="max-width:300px;margin:0 auto">${linkBad?esc(linkBad):'선생님께 받은 나만의 링크로 열어 주세요.'}</p></div>`;
  const left=Math.ceil((lockedUntil-Date.now())/1000), locked=left>0;
  const msg=locked?`<span style="color:var(--bad)">5번 틀려서 잠겼어요. ${left>=60?Math.ceil(left/60)+'분':left+'초'} 뒤에 다시 해 주세요.</span>`
    :loginErr?`<span style="color:var(--bad)">${esc(loginErr)}</span>`:busy?'확인 중…':'처음 한 번만 번호 네 자리를 눌러 주세요';
  const dis=locked||busy?' disabled':'';
  return `<div class="head" style="padding-top:28px;text-align:center"><div class="sub">보리네</div><h1>${esc(linkName)}님, 반가워요</h1></div>
    <section class="card pinbox">
      <div class="pins${shake?' shake':''}" aria-label="입력한 자리 수 ${pin.length}/4">${[0,1,2,3].map(i=>`<i class="${i<pin.length?'on':''}"></i>`).join('')}</div>
      <p class="muted" style="text-align:center;min-height:22px;margin:10px 0 14px" role="status">${msg}</p>
      <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-key="${n}"${dis}>${n}</button>`).join('')}
        <span></span><button data-key="0"${dis}>0</button><button data-key="del" aria-label="지우기"${dis}>⌫</button></div>
    </section>`;
}
function startLockTimer(){clearInterval(lockTimer);lockTimer=setInterval(()=>{if(role){clearInterval(lockTimer);return}render();if(Date.now()>lockedUntil){clearInterval(lockTimer);loginErr='';render()}},1000)}
async function tryPin(){
  busy=true;render();
  try{const {session}=await DB.api('login',{token:linkToken,pin});await DB.setSession(session);pin='';loginErr='';await enter()}
  catch(e){pin='';shake=true;loginErr=e.message;if(e.status===404)linkBad=e.message;if(e.data?.lockedFor){lockedUntil=Date.now()+e.data.lockedFor*1000;loginErr='';startLockTimer()}busy=false;render();setTimeout(()=>{shake=false},400)}
}
async function enter(){
  const p=await DB.myProfile();
  if(!p){role=null;busy=false;loginErr='계정 정보를 찾지 못했어요. 선생님께 문의해 주세요.';render();return}
  role=p.role==='admin'?'teacher':'student';MYUID=p.id;
  view.innerHTML='<div class="empty" style="padding-top:30vh">불러오는 중…</div>';bar.hidden=true;
  try{await loadAll()}catch(e){view.innerHTML=`<section class="card" style="margin-top:20vh"><b>불러오지 못했어요</b><p class="muted">${esc(e.message)}</p><button class="btn" data-logout="1">처음으로</button></section>`;busy=false;return}
  if(role==='student'){curSid=N(p.id);load(curSid);tab='home'}else{ttab='today'}
  busy=false;render();window.scrollTo(0,0);
}
async function logout(){
  const was=role;
  await DB.signOut();role=null;preview=false;pin='';sLesson=null;stuDetail=null;lessonCtx=null;gradeId=null;
  if(was==='teacher'){gate='teacher';if(location.hash!=='#teacher')history.replaceState(null,'','#teacher')}

document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target, fd=new FormData(f), g=k=>String(fd.get(k)??'').trim();
  const btn=f.querySelector('button:not([type=button])');if(btn){if(btn.disabled)return;btn.disabled=true}

  if(f.id==='editStuForm'){const sid=+f.dataset.sid, subjects=fd.getAll('subj');
    if(!g('name')){toast('이름을 넣어 주세요');return}if(!subjects.length){toast('과목을 하나 이상 골라 주세요');return}

  if(f.id==='makeupForm'){const sid=+f.dataset.sid;if(!g('date')||!g('time')){toast('날짜와 시간을 넣어 주세요');return}

  if(f.id==='stuSchedForm'){const sid=+f.dataset.sid;
